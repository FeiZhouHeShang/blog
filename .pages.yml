# PagesCMS 配置 - Firefly 博客
# 基于 PagesCMS v2.x 官方 schema 编写
# 文档: https://pagescms.org/docs/configuration/
# 注意：本文件必须位于仓库根目录（与 package.json 同级），PagesCMS 才能扫描到。

# ============================================================
# 📁 媒体资源库（按功能分目录，后台「站点资源」可见）
# input  = 仓库内目录；output = 站点访问 URL 前缀
# 当前博客图片多走图床，后续转本地时按对应目录落盘即可
# ============================================================
media:
  # 站点全量资源（兜底查看）
  - name: site-assets
    label: 站点资源(全部)
    input: public/assets
    output: /assets
    categories: [image, video]

  # 文章配图 - 上传到文章目录的 images 子文件夹
  - name: post-images
    label: 文章配图
    input: src/content/posts/images
    output: /images
    categories: [image]

  # 头图 / 壁纸
  - name: banner
    label: 站点头图
    input: public/assets/images
    output: /assets/images
    categories: [image, video]

  # ---- 按功能分目录 ----
  - name: media-home
    label: 首页资源
    input: public/assets/images/home
    output: /assets/images/home
    categories: [image]

  - name: media-profile
    label: 个人信息头像
    input: public/assets/images/profile
    output: /assets/images/profile
    categories: [image]

  - name: media-movies-games
    label: 影视游戏封面
    input: public/assets/images/movies-games
    output: /assets/images/movies-games
    categories: [image]

  - name: media-moments
    label: 日常吐槽图片
    input: public/assets/images/moments
    output: /assets/images/moments
    categories: [image]

  - name: media-gallery
    label: 相册图片
    input: public/assets/images/gallery
    output: /assets/images/gallery
    categories: [image]

  - name: media-friends
    label: 友链头像
    input: public/assets/images/friends
    output: /assets/images/friends
    categories: [image]

  - name: media-guestbook
    label: 留言板图片
    input: public/assets/images/guestbook
    output: /assets/images/guestbook
    categories: [image]

  - name: media-sponsor
    label: 打赏二维码
    input: public/assets/images/sponsor
    output: /assets/images/sponsor
    categories: [image]

  - name: media-about
    label: 关于页图片
    input: public/assets/images/about
    output: /assets/images/about
    categories: [image]

  - name: media-music
    label: 音乐封面
    input: public/assets/music/cover
    output: /assets/music/cover
    categories: [image]

  - name: media-pio
    label: 看板娘模型
    input: public/assets/images/pio
    output: /assets/images/pio
    categories: [image]

  # 视频资源
  - name: site-videos
    label: 站点视频
    input: public/assets/videos
    output: /assets/videos
    categories: [video]

content:
  # ============================================================
  # 📝 内容页面
  # ============================================================
  - name: content-pages
    label: 📝 内容页面
    type: group
    items:
      # 博客文章 (collection)
      - name: posts
        label: 📝 博客文章
        type: collection
        path: src/content/posts
        format: yaml-frontmatter
        filename:
          template: "{primary}.md"
          field: create
        # 排除「功能说明书.md / README.md / _*.md」等文档文件，防止后台把维护手册当可编辑文章
        exclude: ["**/images/**", "**/*.avif", "**/*.webp", "**/*.png", "**/*.jpg", "**/*功能说明书*.md", "**/README.md", "**/_*.md"]
        view:
          primary: title
          fields: [title, published, tags, category, draft, pinned]
          sort: ["published desc", "title asc"]
          search: [title, description, tags, category]
          default:
            sort: published
            order: desc
        fields:
          - name: title
            label: 标题
            type: string
            required: true
            description: 文章标题

          - name: published
            label: 发布时间
            type: date
            required: true
            options:
              time: false
              format: yyyy-MM-dd

          - name: updated
            label: 更新时间
            type: date
            options:
              time: false
              format: yyyy-MM-dd

          - name: draft
            label: 草稿
            type: boolean
            default: false

          - name: description
            label: 文章摘要
            type: text
            description: 简短描述，留空则自动截取正文

          - name: image
            label: 封面图
            type: image
            description: 文章封面图片路径

          - name: tags
            label: 标签
            type: select
            description: 标签候选来自 src/content/posts 下所有文章的 frontmatter.tags 聚合（构建期由 scripts/gen-posts-index.mjs 自动同步到 cms-data/tags.json）。可新建：选中「+ 新建标签」即可，输入后回车确认。
            options:
              multiple: true
              creatable: true
              # 引用构建期聚合的真实标签集，PagesCMS 后台下拉 = 前台编辑器下拉 = 实际文章标签
              values: data://cms-data/tags.json

          - name: category
            label: 分类
            type: select
            description: 分类候选来自 src/content/posts 下所有文章的 frontmatter.category 聚合（构建期同步到 cms-data/categories.json）。可新建。
            options:
              creatable: true
              values: data://cms-data/categories.json

          - name: lang
            label: 语言
            type: select
            options:
              values:
                - { label: 中文, value: "" }
                - { label: English, value: en }
                - { label: 日本語, value: ja }
                - { label: 繁體中文, value: zh_TW }
                - { label: Русский, value: ru }

          - name: pinned
            label: 置顶
            type: boolean
            default: false

          - name: author
            label: 作者
            type: string
            description: 覆盖默认作者名（通常留空）

          - name: sourceLink
            label: 原文链接
            type: string
            description: 转载/翻译文章的原始出处

          - name: licenseName
            label: 许可协议名称
            type: string
            description: 如 CC BY-NC-SA 4.0

          - name: licenseUrl
            label: 许可协议链接
            type: string

          - name: comment
            label: 启用评论
            type: boolean
            default: true

          - name: password
            label: 文章密码
            type: string
            description: 设置后需要密码才能查看（留空为公开）

          - name: passwordHint
            label: 密码提示
            type: string
            description: 提示访问者密码是什么

          - name: body
            label: 正文
            type: rich-text
            required: true


      # 关于页面
      - name: about
        label: 📄 关于页面
        type: file
        path: src/content/spec/about.md
        format: yaml-frontmatter
        fields:
          - name: title
            label: 页面标题
            type: string
            default: "关于我"
          - name: body
            label: 正文
            type: rich-text

      # 友情链接
      # 注：实际友链数据由 src/config/friendsConfig.ts 维护（见下方「友链数据」条目），
      # friends.md 仅承载 title/description 元数据（被 src/pages/friends.astro 读取），
      # body 字段保留为富文本以便 PagesCMS 后台补一段说明。
      - name: friends
        label: 🔗 友情链接
        type: file
        path: src/content/spec/friends.md
        format: yaml-frontmatter
        fields:
          - name: title
            label: 页面标题
            type: string
            default: 友情链接
          - name: description
            label: 页面描述
            type: string
          - name: body
            label: 正文
            type: rich-text
            description: 友链页正文说明（可选）。实际友链数据请在「友链数据」条目里编辑。

      # 留言板
      - name: guestbook
        label: 📬 留言板
        type: file
        path: src/content/spec/guestbook.md
        format: yaml-frontmatter
        fields:
          - name: title
            label: 页面标题
            type: string
            default: 留言板
          - name: body
            label: 正文
            type: rich-text

      # 隐私政策
      - name: privacy
        label: 🔒 隐私政策
        type: file
        path: src/content/spec/privacy.md
        format: yaml-frontmatter
        fields:
          - name: title
            label: 页面标题
            type: string
            default: 隐私政策
          - name: body
            label: 正文
            type: rich-text

      # 用户协议
      - name: user-agreement
        label: 📜 用户协议
        type: file
        path: src/content/spec/user-agreement.md
        format: yaml-frontmatter
        fields:
          - name: title
            label: 页面标题
            type: string
            default: 用户协议
          - name: body
            label: 正文
            type: rich-text

  # ============================================================
  # ⚙️ 站点设置
  # ============================================================
  - name: site-settings
    label: ⚙️ 站点设置
    type: group
    description: 核心站点配置，包括标题、域名、SEO、个人信息等
    items:
      - name: site-config
        label: 🌐 站点主配置
        type: file
        path: src/config/siteConfig.ts
        format: code
        description: 站点标题、URL、主题色、分页、归档统计、图片优化等核心设置

      - name: profile-config
        label: 👤 个人信息
        type: file
        path: src/config/homeConfig.ts
        format: code
        description: 头像、昵称、签名、社交链接、技能、首页作品等个人资料与首页配置

      - name: announcement-config
        label: 📢 公告栏
        type: file
        path: src/config/announcementConfig.ts
        format: code
        description: 博客顶部公告栏的标题、内容和链接配置

      - name: license-config
        label: 📜 许可协议
        type: file
        path: src/config/licenseConfig.ts
        format: code
        description: 文章底部版权声明（如 CC BY-NC-SA 4.0）

      - name: calendar-config
        label: 📅 日历配置
        type: file
        path: src/config/calendarConfig.ts
        format: code
        description: 日历页面配置（节假日、生日、日程等）

      - name: ai-search-config
        label: 🤖 AI 搜索配置
        type: file
        path: src/config/aiSearchConfig.ts
        format: code
        description: AI 语义搜索的模型、Embedding、向量索引名称等

  # ============================================================
  # 🎨 布局与外观
  # ============================================================
  - name: layout-appearance
    label: 🎨 布局与外观
    type: group
    description: 导航栏、侧边栏、壁纸、字体等视觉相关配置
    items:
      - name: nav-bar-config
        label: 🧭 导航栏
        type: file
        path: src/config/navBarConfig.ts
        format: code
        description: 导航栏菜单项、链接预设和搜索配置

      - name: sidebar-config
        label: 📐 侧边栏布局
        type: file
        path: src/config/sidebarConfig.ts
        format: code
        description: 侧边栏位置、组件（个人资料、公告、音乐、分类、标签等）的显示和排序

      - name: footer-config
        label: 📏 页脚设置
        type: file
        path: src/config/footerConfig.ts
        format: code
        description: 页脚开关控制 + 自定义 HTML 内容（备案号、版权信息等）

      - name: font-config
        label: 🔤 字体设置
        type: file
        path: src/config/fontConfig.ts
        format: code
        description: 全局字体、横幅字体、Google Fonts、子集化等配置

      - name: cover-image-config
        label: 🖼️ 文章封面图
        type: file
        path: src/config/coverImageConfig.ts
        format: code
        description: 文章详情页封面图显示和随机图 API 配置

      - name: background-wallpaper
        label: 🏞️ 背景壁纸
        type: file
        path: src/config/backgroundWallpaper.ts
        format: code
        description: 全屏壁纸、横幅壁纸、视频背景、水波纹、渐变等背景特效（当前未启用）

      - name: expressive-code-config
        label: 💻 代码块样式
        type: file
        path: src/config/expressiveCodeConfig.ts
        format: code
        description: 代码高亮主题、折叠插件、语言徽章等代码块配置

  # ============================================================
  # 🔧 功能配置
  # ============================================================
  - name: feature-settings
    label: 🔧 功能配置
    type: group
    description: 评论、统计、音乐、打赏、友链、特效等功能模块配置
    items:
      - name: comment-config
        label: 💬 评论系统
        type: file
        path: src/config/commentConfig.ts
        format: code
        description: Twikoo / Waline / Giscus / Artalk / Disqus 评论系统配置

      - name: analytics-config
        label: 📊 数据统计
        type: file
        path: src/config/analyticsConfig.ts
        format: code
        description: Google Analytics、Microsoft Clarity、Umami、51la 统计配置

      - name: music-config
        label: 🎵 音乐播放器
        type: file
        path: src/config/musicConfig.ts
        format: code
        description: 音乐播放模式（Meting API / 本地音乐）、播放列表、歌词设置

      - name: sponsor-config
        label: 💰 打赏页面
        type: file
        path: src/config/sponsorConfig.ts
        format: code
        description: 打赏用途、支付方式（支付宝/微信/Ko-fi/爱发电）、赞助者列表

      - name: friends-data
        label: 🔗 友链数据
        type: file
        path: src/config/friendsConfig.ts
        format: code
        description: 友链列表（站点名、头像、描述、链接、标签、权重）

      - name: guestbook-config
        label: 📬 留言板配置
        type: file
        path: src/config/guestbookConfig.ts
        format: code
        description: 留言板规则公告等配置

      - name: effects-config
        label: 🌸 樱花特效
        type: file
        path: src/config/effectsConfig.ts
        format: code
        description: 樱花飘落动画的数量、速度、尺寸、透明度等参数（当前未启用）

      - name: gallery-config
        label: 🖼️ 相册配置
        type: file
        path: src/config/galleryConfig.ts
        format: code
        description: 相册列表（ID、名称、描述、地点、日期、标签、密码）和布局设置

      - name: pio-config
        label: 🎭 看板娘
        type: file
        path: src/config/pioConfig.ts
        format: code
        description: Spine / Live2D 看板娘模型、位置、交互、气泡提示配置

      - name: plantuml-config
        label: 📐 PlantUML 图表
        type: file
        path: src/config/plantumlConfig.ts
        format: code
        description: PlantUML 服务器地址和明暗主题配置

      - name: collections-api-config
        label: 🧰 工具导航/收藏 API
        type: file
        path: src/config/collectionsApiConfig.ts
        format: code
        description: 工具导航页的收藏 API 分组与条目配置

      # ============================================================
      # 💬 日常吐槽 / 说说（参考 blog.tsh520.cn/moments 1:1 复刻）
      # 数据：src/content/moments/*.md，每条说说一个文件
      # 前端「我要吐槽」编辑器已移除（2026-07-30），编辑统一走后台
      # ============================================================
      - name: moments
        label: 💬 日常吐槽（说说）
        type: collection
        path: src/content/moments
        format: yaml-frontmatter
        # 排除「功能说明书.md / README.md / _*.md」等文档文件，防止后台把维护手册当可编辑说说
        exclude: ["**/*功能说明书*.md", "**/README.md", "**/_*.md"]
        filename:
          # 新建时自己填一个英文短文件名（不带 .md），作为锚点 id，保持唯一
          field: create
        view:
          primary: date
          fields: [date, pinned, tags]
          sort: ["date desc"]
          search: [body, date, tags]
          default:
            sort: date
            order: desc
        fields:
          - name: body
            label: 正文
            type: markdown
            required: true
            description: "说点什么～支持 Markdown。这是这条说说的主要内容，回车分段；加粗 **文字**、链接 [文字](地址) 都支持。"
          - name: date
            label: 发布时间
            type: string
            description: "格式 YYYY-MM-DD HH:mm（24 小时制，空格分隔）。留空显示「刚刚」，排序也按它倒序。"
          - name: location
            label: 地点
            type: string
            description: "可选。如「杭州」「中国」，显示在时间旁边。"
          - name: tags
            label: 标签
            type: list
            description: "可选。每条一个，回车添加；页面以 #标签 形式展示。"
            fields:
              - name: tag
                label: 标签
                type: string
          - name: pinned
            label: 置顶
            type: boolean
            default: false
            description: "勾选后固定在信息流顶部「📌 置顶」区。"
          - name: images
            label: 图片
            type: list
            description: "可选，每行一张。图床外链（https://...）或后台「站点资源→日常吐槽图片」上传后的本地路径；最多 9 张，点击进入灯箱放大。"
            fields:
              - name: url
                label: 图片地址
                type: string
          - name: videos
            label: 视频
            type: list
            description: "可选，每行一个 mp4/webm 直链。页面以 ▶ 缩略图呈现，点击灯箱加载播放（不预加载）。"
            fields:
              - name: url
                label: 视频地址
                type: string

settings:
  content:
    merge: false
